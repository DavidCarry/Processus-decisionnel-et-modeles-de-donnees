name: speak-with-data

x-acces: &acces
  S3_ENDPOINT: datalake:9000
  S3_ACCESS_KEY: admin
  S3_SECRET_KEY: admin12345
  S3_BUCKET: datalake
  DW_DSN: host=dw port=5432 dbname=dw user=dw password=dw

services:
  # Data lake : stockage S3 (RustFS, compatible MinIO/AWS)
  datalake:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: admin12345
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [datalake:/data]

  # Data warehouse (base dw) + métadonnées Airflow (base airflow)
  dw:
    image: postgres:16
    environment:
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dw
      POSTGRES_DB: dw
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - dw:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dw", "-d", "dw"]
      interval: 5s
      retries: 20

  # Orchestration : http://localhost:8080
  airflow:
    build: .
    image: speak-with-data
    command: standalone
    environment:
      <<: *acces
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://dw:dw@dw:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes: [./dags:/opt/airflow/dags]
    depends_on:
      dw: {condition: service_healthy}
      datalake: {condition: service_started}

  # Prototypage : http://localhost:8888
  jupyter:
    build: .
    image: speak-with-data
    depends_on: [airflow]
    entrypoint: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser",
                 "--IdentityProvider.token=", "--ServerApp.root_dir=/opt/airflow/notebooks"]
    environment: *acces
    ports: ["127.0.0.1:8888:8888"]
    volumes: [./notebooks:/opt/airflow/notebooks]

volumes:
  datalake:
  dw:
