name: speak-with-data-hop

# Accès au data lake et au data warehouse, transmis à Hop (voir lancer.sh).
x-acces: &acces
  S3_HOST: datalake
  S3_PORT: "9000"
  S3_ACCESS_KEY: &s3_utilisateur admin
  S3_SECRET_KEY: &s3_mot_de_passe admin12345
  S3_BUCKET: datalake
  PGHOST: dw
  PGPORT: "5432"
  PGDATABASE: &dw_base dw
  PGUSER: &dw_utilisateur dw
  PGPASSWORD: &dw_mot_de_passe dw

services:
  # Data lake : stockage S3 (RustFS). Même volume que l'exercice 3 : les données brutes ne sont téléchargées qu'une fois.
  datalake:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: *s3_utilisateur
      RUSTFS_SECRET_KEY: *s3_mot_de_passe
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [datalake:/data]

  # Data warehouse, propre à cet exercice
  dw:
    image: postgres:16
    environment:
      POSTGRES_USER: *dw_utilisateur
      POSTGRES_PASSWORD: *dw_mot_de_passe
      POSTGRES_DB: *dw_base
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - dw:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dw", "-d", "dw"]
      interval: 5s
      retries: 20

  # Apache Hop : exécute le workflow chargement_dw.hwf (téléchargement, puis chargement du data warehouse) et s'arrête
  hop:
    build: .
    image: speak-with-data-hop
    environment:
      <<: *acces
      HOP_OPTIONS: -Xmx3g
    volumes: [./hop:/project]
    depends_on:
      dw: {condition: service_healthy}
      datalake: {condition: service_started}

volumes:
  datalake:
    name: speak-with-data_datalake
  dw:
